# Shelest reviewed runtime schema. The complete official pinyin_simp dictionary
# supplies conversion; this file is configuration, not a miniature word table.
schema:
  schema_id: shelest_pinyin_simp
  name: Shelest Simplified Pinyin
  version: "1"
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [script_translator]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: pinyin_simp
  enable_user_dict: false
  enable_sentence: true
  enable_completion: true
  enable_encoder: false
menu:
  page_size: 9
